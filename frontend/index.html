<!-- Serves as the primary HTML wrapper for rendering React views. -->
<!-- Declares viewport configurations and preloads site metadata. -->


<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sai IT Services - Project Management Portal</title>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
  <meta name="description" content="Manage clients, projects, tasks, milestones, deliverables, and invoices from a single dashboard. Built for teams that need to stay organized." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#4F46E5" media="(prefers-color-scheme: light)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta property="og:title" content="Sai IT Services - Project Management Portal" />
  <meta property="og:description" content="Manage clients, projects, tasks, milestones, deliverables, and invoices from a single dashboard." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/webp" href="/logo.webp" />
  <link rel="apple-touch-icon" href="/favicon-192x192.png" />

  <style>
    #root {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      background-color: #f8fafc;
    }
    /* Instant Initial Loader for FCP */
    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      z-index: 9999;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .spinner-svg {
      animation: rotate 2s linear infinite;
    }
    .spinner-svg circle {
      stroke-dasharray: 1, 150;
      stroke-dashoffset: 0;
      animation: dash 1.5s ease-in-out infinite;
    }
    .loader-text {
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      margin: 0;
    }
    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }
    @keyframes dash {
      0% {
        stroke-dasharray: 1, 150;
        stroke-dashoffset: 0;
      }
      50% {
        stroke-dasharray: 90, 150;
        stroke-dashoffset: -35;
      }
      100% {
        stroke-dasharray: 90, 150;
        stroke-dashoffset: -124;
      }
    }
  </style>
</head>

<body>
  <div id="initial-loader">
      <div class="loader-content">
        <svg class="spinner-svg" width="32" height="32" viewBox="0 0 50 50">
          <circle cx="25" cy="25" r="20" fill="none" stroke="#4f46e5" stroke-width="5" stroke-linecap="round"></circle>
        </svg>
        <p class="loader-text">Loading...</p>
      </div>
  </div>
  <div id="root"></div>
  <noscript>
    <iframe src="/noscript.html" style="position: fixed; inset: 0; width: 100%; height: 100%; border: none; z-index: 100000; background: #ffffff;"></iframe>
  </noscript>
  <script type="module" src="/index.jsx"></script>
</body>

</html>
