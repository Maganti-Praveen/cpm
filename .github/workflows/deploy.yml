name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Verify Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # --- Verify Backend ---
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      # --- Verify Frontend ---
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend (Vite)
        run: |
          cd frontend
          npm run build

  deploy:
    name: Deploy to Render
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Backend Deploy
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$BACKEND_HOOK" ]; then
            echo "Triggering backend deploy..."
            CLEAN_HOOK=$(echo "$BACKEND_HOOK" | xargs)
            curl -s -S -X POST "$CLEAN_HOOK"
          else
            echo "Warning: RENDER_BACKEND_DEPLOY_HOOK secret is not set. Skipping backend deploy."
          fi

      - name: Trigger Frontend Deploy
        env:
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$FRONTEND_HOOK" ]; then
            echo "Triggering frontend deploy..."
            CLEAN_HOOK=$(echo "$FRONTEND_HOOK" | xargs)
            curl -s -S -X POST "$CLEAN_HOOK"
          else
            echo "Warning: RENDER_FRONTEND_DEPLOY_HOOK secret is not set. Skipping frontend deploy."
          fi
